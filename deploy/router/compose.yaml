name: new-api-router

x-runtime: &runtime
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging:
    driver: local
    options: {max-size: 10m, max-file: '3'}

services:
  new-api:
    <<: *runtime
    image: ${NEW_API_IMAGE:?required}
    pull_policy: never
    command: ['--log-dir', '']
    ports: ['127.0.0.1:3000:3000']
    environment:
      SQL_DSN: postgresql://newapi:${POSTGRES_PASSWORD:?required}@postgres:5432/newapi?sslmode=disable
      REDIS_CONN_STRING: redis://:${REDIS_PASSWORD:?required}@redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET:?required}
      SESSION_COOKIE_SECURE: 'true'
      SESSION_COOKIE_TRUSTED_URL: https://router.cdkey.si
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:?required}
      TZ: Asia/Shanghai
      DEFAULT_LANGUAGE: zh-CN
      NODE_NAME: router-ovh-1
      ERROR_LOG_ENABLED: 'true'
      BATCH_UPDATE_ENABLED: 'true'
    volumes: ['./data:/data']
    networks:
      egress: {ipv4_address: 10.206.60.10, gw_priority: 1}
      database: {ipv4_address: 10.206.61.10}
    mem_limit: 2g
    cpus: 2
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://127.0.0.1:3000/api/status | grep -q ''"success":true''']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    <<: *runtime
    image: ${POSTGRES_IMAGE:?required}
    pull_policy: never
    environment:
      POSTGRES_USER: newapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: newapi
      TZ: Asia/Shanghai
    volumes: ['./postgres:/var/lib/postgresql/data']
    networks: {database: {ipv4_address: 10.206.61.20}}
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U newapi -d newapi']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    <<: *runtime
    image: ${REDIS_IMAGE:?required}
    pull_policy: never
    environment: {REDIS_PASSWORD: '${REDIS_PASSWORD:?required}'}
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction']
    volumes: ['./redis:/data']
    networks: {database: {ipv4_address: 10.206.61.21}}
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  tools:
    <<: *runtime
    profiles: [tools]
    image: ${TOOLS_IMAGE:?required}
    pull_policy: never
    ports: ['127.0.0.1:1145:80']
    environment:
      SQL_DSN: postgresql://newapi_tools:${TOOLS_DB_PASSWORD:?required}@postgres:5432/newapi?sslmode=disable
      REDIS_CONN_STRING: redis://:${REDIS_PASSWORD:?required}@redis:6379/1
      ADMIN_PASSWORD: ${TOOLS_ADMIN_PASSWORD:?required}
      API_KEY: ${TOOLS_API_KEY:?required}
      JWT_SECRET_KEY: ${TOOLS_JWT_SECRET:?required}
      JWT_EXPIRE_HOURS: '8'
      NEWAPI_BASEURL: http://new-api:3000
      AUTO_ENSURE_INDEXES: 'false'
      ENFORCE_IP_RECORDING: 'false'
      TZ: Asia/Shanghai
    volumes:
      - ./tools-data:/app/data
      - ./tools-server:/app/server:ro
    networks:
      egress: {ipv4_address: 10.206.60.11, gw_priority: 1}
      database: {ipv4_address: 10.206.61.11}
    mem_limit: 512m
    cpus: 1
    depends_on:
      new-api: {condition: service_healthy}

networks:
  egress:
    name: newapi-router-egress
    driver_opts: {com.docker.network.bridge.name: newapi-out}
    ipam: {config: [{subnet: 10.206.60.0/24}]}
  database:
    name: newapi-router-database
    internal: true
    driver_opts: {com.docker.network.bridge.name: newapi-db}
    ipam: {config: [{subnet: 10.206.61.0/24}]}
